<!DOCTYPE html>
<html lang="id" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Data Intelligence - AI Dashboard & Reports</title>
    <!-- Tailwind CSS & DaisyUI CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js for Dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-base-300 min-h-screen text-base-content antialiased">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- HEADER -->
        <header class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-3">
                Nexus Data <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">Intelligence</span>
            </h1>
            <p class="text-base-content/70 text-lg font-light">Automated AI-Driven Dashboards & Professional Reporting</p>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- 1. CONFIG PANEL (LEFT COLUMN) -->
            <section class="lg:col-span-5">
                <div class="card glass-card shadow-2xl p-6 rounded-2xl">
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-2 border-b border-base-content/10 pb-3">
                        <span class="text-primary text-2xl">⚡</span> 1. Data Source & Settings
                    </h2>
                    
                    <form id="process-form" class="space-y-6">
                        <!-- UPLOAD FILE -->
                        <div class="form-control">
                            <label class="label font-semibold text-sm">Upload File (Excel/CSV) OR Google Sheets URL</label>
                            <div class="border-2 border-dashed border-base-content/20 hover:border-primary/50 transition-all rounded-xl p-8 text-center cursor-pointer bg-base-100/30" id="drop-zone">
                                <p class="text-base-content/60 text-sm">Drag & Drop file here or <span class="text-primary font-bold">Browse</span></p>
                                <input type="file" id="file-input" accept=".csv, .xls, .xlsx" hidden>
                            </div>
                            <div class="text-xs text-success mt-2 font-medium" id="file-name-display"></div>
                            
                            <div class="divider text-xs text-base-content/30 my-4">OR</div>
                            
                            <input type="url" id="url-input" class="input input-bordered w-full input-md rounded-xl bg-base-100/50" placeholder="https://docs.google.com/spreadsheets/d/.../edit">
                        </div>

                        <!-- OUTPUT OPTIONS -->
                        <div class="form-control">
                            <label class="label font-semibold text-sm">Select Outputs</label>
                            <div class="flex flex-col gap-3 mt-1">
                                <label class="label cursor-pointer justify-start gap-3 bg-base-100/20 p-3 rounded-xl hover:bg-base-100/40 transition">
                                    <input type="checkbox" id="chk-dashboard" checked class="checkbox checkbox-primary">
                                    <span class="label-text font-medium">Dashboard (Charts)</span>
                                </label>
                                <label class="label cursor-pointer justify-start gap-3 bg-base-100/20 p-3 rounded-xl hover:bg-base-100/40 transition">
                                    <input type="checkbox" id="chk-pivot" checked class="checkbox checkbox-primary">
                                    <span class="label-text font-medium">Pivot Table</span>
                                </label>
                                <label class="label cursor-pointer justify-start gap-3 bg-base-100/20 p-3 rounded-xl hover:bg-base-100/40 transition">
                                    <input type="checkbox" id="chk-report" checked class="checkbox checkbox-primary">
                                    <span class="label-text font-medium">AI Executive Report</span>
                                </label>
                            </div>
                        </div>

                        <!-- ADDITIONAL NOTES -->
                        <div class="form-control">
                            <label class="label font-semibold text-sm" for="ai-notes">Additional Notes for AI Analysis</label>
                            <textarea id="ai-notes" class="textarea textarea-bordered w-full rounded-xl bg-base-100/50" rows="3" placeholder="E.g., Focus on analyzing the trend of sales over time..."></textarea>
                        </div>

                        <!-- SUBMIT -->
                        <button type="submit" class="btn btn-primary w-full rounded-xl shadow-lg font-bold text-lg" id="submit-btn">
                            <span class="btn-text">Generate Intelligence</span>
                            <span class="loading loading-spinner hidden" id="btn-loader"></span>
                        </button>
                    </form>
                </div>
            </section>

            <!-- 2. RESULTS PANEL (RIGHT COLUMN) -->
            <section class="lg:col-span-7 space-y-6 hidden" id="results-section">
                <!-- INTERACTIVE SLICERS & ACTIONS -->
                <div class="card glass-card shadow-xl p-6 rounded-2xl" id="card-controls">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                        <div>
                            <h3 class="font-bold text-lg flex items-center gap-2">
                                <span>🔍</span> Interactive Web Slicers
                            </h3>
                            <p class="text-xs text-base-content/60 mt-1">Filter your data in real-time before downloading.</p>
                        </div>
                        <div class="flex gap-2">
                            <button class="btn btn-outline btn-sm rounded-lg" id="btn-download-img">Export PNG</button>
                            <button class="btn btn-success btn-sm text-white rounded-lg" id="btn-download-excel">Download Excel</button>
                        </div>
                    </div>
                    <div id="slicer-buttons" class="flex flex-wrap gap-2 mt-4">
                        <!-- Slicer buttons injected here -->
                    </div>
                </div>

                <!-- DASHBOARD CONTAINER -->
                <div class="card glass-card shadow-xl p-6 rounded-2xl hidden" id="card-dashboard">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                        <span>📊</span> Interactive Dashboard
                    </h2>
                    <div class="relative w-full h-80">
                        <canvas id="mainChart"></canvas>
                    </div>
                </div>

                <!-- AI REPORT CONTAINER -->
                <div class="card glass-card shadow-xl p-6 rounded-2xl hidden" id="card-report">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                        <span>🤖</span> Executive AI Report
                    </h2>
                    <div class="prose prose-sm max-w-none text-base-content/80 leading-relaxed border-t border-base-content/10 pt-4" id="report-content">
                        <!-- Markdown content goes here -->
                    </div>
                </div>

                <!-- PIVOT TABLE CONTAINER -->
                <div class="card glass-card shadow-xl p-6 rounded-2xl hidden" id="card-pivot">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                        <span>🧮</span> Data Pivot & Summary
                    </h2>
                    <div class="overflow-x-auto border border-base-content/10 rounded-xl">
                        <table class="table w-full" id="pivot-table">
                            <thead>
                                <tr id="pivot-header" class="bg-base-200"></tr>
                            </thead>
                            <tbody id="pivot-body" class="divide-y divide-base-content/5"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Simple Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
